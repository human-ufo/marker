name: Sync upstream (datalab-to/marker)

on:
  schedule:
    - cron: "17 6 * * *"   # diario 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream \
            -f branch=master || echo "conflicto o nada nuevo: revisar a mano"
